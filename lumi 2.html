<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi</title>

    <style>
       
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh; /* Mobilos böngészőkhöz igazítva */
}

.chat-container {
    width: 100%;
    max-width: 400px;
    height: 600px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-header {
    background-color: #6e357e;
    color: white;
    padding: 12px 15px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.bot-avatar-container {
    position: relative;
    width: 60px;
    height: 60px;
}

.bot-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
    background-color: #fff; 
}

.status-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    background-color: #2ecc71;
    border: 2px solid #4a90e2;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
    }
    70% {
        box-shadow: 0 0 0 6px rgba(46, 204, 113, 0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
    }
}

.bot-info {
    display: flex;
    flex-direction: column;
}

.bot-name {
    font-size: 16px;
    font-weight: 600;
}

.bot-status {
    font-size: 12px;
    opacity: 0.85;
}

.chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background-color: #f9f9f9;
}

.message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-line; 
}

.message.bot {
    background-color: #e4e6eb;
    color: #050505;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
}

.message.user {
    background-color: #8863a1;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
}

.typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
    background-color: #e4e6eb;
    border-radius: 10px;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
}

.typing-dot {
    width: 7px;
    height: 7px;
    background-color: #606770;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
}

.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
}

.chat-input-area {
    display: flex;
    align-items: flex-end; 
    padding: 10px;
    background: #ffffff;
    border-top: 1px solid #ddd;
}

.chat-input-area textarea {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 20px;
    outline: none;
    font-size: 14px;
    resize: none; 
    max-height: 280px; 
    overflow-y: auto; 
    font-family: inherit;
    line-height: 1.4;
    transition: border-color 0.2s;
}

.chat-input-area textarea:focus {
    border-color: #4a90e2;
}

.chat-input-area button {
    background-color: #6e357e;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    margin-left: 8px;
    cursor: pointer;
    font-weight: 600;
    height: 42px; 
    transition: background-color 0.2s;
}

.chat-input-area button:hover {
    background-color: #357abd;
}

/* Mobilos nézet: teljes magasság és szélesség, hogy ne legyen üres hely alatta/fölötte */
@media (max-width: 480px) {
    body {
        align-items: stretch;
        background-color: #ffffff; /* Opcionális: háttér színezés mobilon */
    }

    .chat-container {
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
    }
}
	   
    </style>

const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(text, sender) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', sender);
    messageDiv.textContent = text;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.classList.add('typing-indicator');
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    chatMessages.appendChild(typingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeTypingIndicator() {
    const typingDiv = document.getElementById('typingIndicator');
    if (typingDiv) {
        typingDiv.remove();
    }
}
}


function hasKeyword(text, keywords) {
    if (!text || typeof text !== 'string') return false;
    
    // A felhasználói szöveget kisbetűssé alakítjuk és felvágjuk szavakra (szóközök, írásjelek mentén)
    const words = text.toLowerCase().match(/\b[\wáéíóöőúüű]+\b/g) || [];
    
    return keywords.some(keyword => {
        if (typeof keyword !== 'string') return false;
        
        // Ha a kulcsszó több szóból áll (pl. "szerződési feltételek"), azt egyben vizsgáljuk
        if (keyword.includes(' ')) {
            return text.toLowerCase().includes(keyword.toLowerCase());
        }
        
        // Ha egyszavas kulcsszó, akkor csak akkor fogadjuk el, ha pontosan egyezik az egyik szóval
        return words.includes(keyword.toLowerCase());
    });
}

function handleUserMessage() {
    const text = userInput.value.trim();
    if (text === "") return;

    addMessage(text, 'user');
    userInput.value = "";

    showTypingIndicator();

    setTimeout(() => {
        removeTypingIndicator();
        const botReply = getBotResponse(text);
        addMessage(botReply, 'bot');
    }, 1000);
}

sendBtn.addEventListener('click', handleUserMessage);
userInput.addEventListener('keypress', (e) => {
    (e.key === 'Enter') && handleUserMessage();
