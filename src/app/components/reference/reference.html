<section id="references" class="references-section pt-5 mt-3 font">
  <div class="container">
    
    <!-- Szekció Cím (Nyelvfüggő) -->
    <div class="text-center mb-1">
      <h2 class="watercolor-title  fw-bold">
        <span *ngIf="currentLang === 'hu'">Referenciák & Utolsó Projektek</span>
        <span *ngIf="currentLang === 'en'">References & Latest Projects</span>
      </h2>
      <h5 *ngIf="currentLang === 'hu'">Néhány érzékény adat elrejtve a GDPR szabályok szerint.</h5>
      <h5 *ngIf="currentLang === 'en'">Some sensitive data hidden in accordance with GDPR rules.</h5>
      <div class="watercolor-divider mx-auto my-2"></div>
 
    </div>

    <!-- 10 db Teljes Szélességű Kártya -->
    <div class="row gy-2">
      <div *ngFor="let project of projects; let pIndex = index" class="col-12">
        <div class="card watercolor-card shadow-sm border-0 p-2 p-md-2">
          
          <!-- 1. FENT: Projekt címe (HTML tartalommal és nyelvválasztással) -->
          <div class="row mb-4">
            <div class="col-12 text-center text-lg-start">
              <h3 class="h2 project-heading" 
                  [innerHTML]="currentLang === 'hu' ? project.titleHtml.hu : project.titleHtml.en">
              </h3>
            </div>
          </div>

          <!-- 2. KÖZÉPEN: 4 fénykép sorban egymás mellett (reszponzív: mobilon 2x2, nagyobb képernyőn 1x4) -->
          <div class="row g-3 mb-4">
            <div *ngFor="let img of project.images; let imgIndex = index" class="col-6 col-md-3">
              <div class="watercolor-thumb-wrapper position-relative overflow-hidden rounded shadow-sm"
                   (click)="openLightbox(pIndex, imgIndex)">
                <img [src]="img.thumb" [alt]="img.title" class="img-fluid w-100 watercolor-thumb">
                <div class="watercolor-overlay d-flex align-items-center justify-content-center">
                  <i class="bi bi-zoom-in text-white fs-4"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- 3. ALUL: HTML Leírás és galéria gomb -->
          <div class="row">
            <div class="col-12">
              <div class="project-content">
                <div class="text-dark project-description lh-lg mb-2 fs-5" 
                     [innerHTML]="currentLang === 'hu' ? project.descriptionHtml.hu : project.descriptionHtml.en">
                </div>
               
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal (Nagyítás, lapozás, bezárás) -->
  <div class="watercolor-lightbox" *ngIf="lightboxOpen" (click)="closeLightbox()">
    <div class="lightbox-content position-relative" (click)="$event.stopPropagation()">
      
      <!-- Bezáró gomb -->
      <button class="btn btn-close btn-close-white position-absolute top-0 end-0 m-3 z-3 fs-5" 
              (click)="closeLightbox()"></button>

      <!-- Fő nagyított kép és címe -->
      <div class="text-center">
        <img [src]="currentImage?.full" [alt]="currentImage?.title" class="img-fluid lightbox-main-img rounded shadow-lg">
        <p class="text-white mt-3 fs-5" [innerHTML]="currentImage?.title"></p>
      </div>

      <!-- Balra / Jobbra navigációs gombok -->
      <button class="bg-secondary fw-bolder btn btn-nav prev-btn position-absolute top-50 start-0 translate-middle-y ms-2 text-light" 
              (click)="prevImage()">←
        <i class="bi bi-chevron-left display-4"></i>
      </button>
      <button class="bg-secondary fw-bolder btn btn-nav next-btn position-absolute top-50 end-0 translate-middle-y me-2 text-light" 
              (click)="nextImage()">→
        <i class="bi bi-chevron-right display-4"></i>
      </button>

      <!-- Aktuális index számláló -->
      <div class="text-center text-white-50 mt-2">
        {{ currentImgIndex + 1 }} / {{ currentProjectImages.length }}
      </div>
      
    </div>
  </div>
</section>

<app-contact class="blur-edge-both"></app-contact>
